<nav
  aria-label="Secciones de Misiones"
  class="flex flex-row items-center gap-3 rounded-lg border-2 border-borde-coleccion bg-fondo-coleccion-superficie p-2 shadow-alta md:sticky md:top-4 md:flex-col md:gap-2.5 md:p-2.5"
>
  @for (seccion of secciones; track seccion.id) {
    <div class="flex flex-col items-center gap-1">
      <button
        type="button"
        [class]="clasesSeccion(seccion.id)"
        [attr.aria-label]="seccion.etiqueta"
        [attr.aria-current]="esActiva(seccion.id) ? 'true' : null"
        [attr.aria-pressed]="esActiva(seccion.id) ? 'true' : null"
        (click)="cambiar.emit(seccion.id)"
      >
        <ng-icon [name]="seccion.icono" size="22" aria-hidden="true" />
      </button>
      @if (!colapsado()) {
        <span
          class="hidden text-[0.65rem] font-bold uppercase tracking-[0.06em] text-texto-secundario md:block"
        >
          {{ seccion.etiqueta }}
        </span>
      }
    </div>
  }

  <button
    type="button"
    class="ml-auto inline-flex size-9 cursor-pointer items-center justify-center rounded-circulo border border-borde-coleccion bg-transparent text-texto-secundario transition-colors hover:bg-white/6 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco md:ml-0 md:mt-1 motion-reduce:transition-none"
    [attr.aria-label]="colapsado() ? 'Expandir panel de secciones' : 'Colapsar panel de secciones'"
    [attr.aria-expanded]="!colapsado()"
    (click)="alternarColapso()"
  >
    <ng-icon
      [name]="colapsado() ? 'phosphorCaretRightFill' : 'phosphorCaretDownFill'"
      size="18"
      aria-hidden="true"
    />
  </button>
</nav>
