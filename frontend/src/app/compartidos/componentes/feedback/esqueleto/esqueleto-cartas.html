<div class="w-full" aria-busy="true" aria-live="polite">
  <span class="sr-only" role="status">Cargando cartas…</span>

  <!-- Contador superior de resumen espejo -->
  <div class="mb-3.5 flex justify-end" aria-hidden="true">
    <app-esqueleto
      variante="texto"
      ancho="13rem"
      alto="0.875rem"
    />
  </div>

  <div class="coleccion__grilla" aria-hidden="true">
    @for (i of itemsIndices(); track i) {
      <div
        class="relative flex aspect-[5/7] w-full flex-col justify-between overflow-hidden rounded-xl border-2 border-borde-coleccion/60 bg-fondo-coleccion-superficie/80 p-2 shadow-marca sm:p-2.5"
      >
        <!-- Fila superior: atributo y categoría -->
        <div class="flex items-center justify-between">
          <app-esqueleto
            variante="circulo"
            ancho="1.5rem"
            alto="1.5rem"
            class="sm:!h-7 sm:!w-7"
          />
          <app-esqueleto
            variante="circulo"
            ancho="1.25rem"
            alto="1.25rem"
            class="sm:!h-6 sm:!w-6"
          />
        </div>

        <!-- Centro: silueta de la ilustración de la carta -->
        <div class="my-1 flex flex-1 items-center justify-center">
          <app-esqueleto
            variante="bloque"
            ancho="85%"
            alto="70%"
            class="rounded-md"
          />
        </div>

        <!-- Pie: nombre y estrellas de rareza -->
        <div class="space-y-1.5">
          <app-esqueleto
            variante="texto"
            [ancho]="i % 2 === 0 ? '75%' : '60%'"
            alto="0.875rem"
            class="sm:!h-4"
          />
          <app-esqueleto
            variante="texto"
            ancho="45%"
            alto="0.625rem"
            class="sm:!h-3"
          />
        </div>
      </div>
    }
  </div>
</div>
