<div class="w-full" aria-busy="true" aria-live="polite">
  <span class="sr-only" role="status">Cargando PT System…</span>

  <ul class="grid grid-cols-1 gap-4 lg:grid-cols-3 lg:gap-6" aria-hidden="true">
    @for (i of itemsIndices(); track i) {
      <li>
        <article
          class="relative flex h-full flex-col justify-between rounded-xl border-2 border-borde-coleccion bg-fondo-coleccion-superficie p-4 sm:p-5 lg:items-center lg:p-6"
        >
          <div class="flex w-full flex-1 flex-col justify-between lg:items-center">
            <!-- Fila superior mobile / Sobre desktop -->
            <div class="flex items-center justify-between gap-4 lg:flex-col lg:justify-center">
              <div class="min-w-0 flex-1 space-y-1.5 lg:hidden">
                <app-esqueleto
                  variante="texto"
                  [ancho]="i === 1 ? '12rem' : '10rem'"
                  alto="1.25rem"
                />
                <app-esqueleto
                  variante="texto"
                  ancho="5rem"
                  alto="0.75rem"
                />
              </div>

              <!-- Sobre -->
              <div class="shrink-0 lg:mb-4">
                <app-esqueleto
                  variante="sobre"
                  ancho="5rem"
                  alto="7rem"
                  class="sm:!h-28 sm:!w-24 lg:!h-44 lg:!w-36"
                />
              </div>
            </div>

            <!-- Textos desktop -->
            <div class="hidden w-full space-y-2 lg:block lg:mb-4 lg:text-center">
              <div class="flex justify-center">
                <app-esqueleto
                  variante="texto"
                  ancho="6rem"
                  alto="0.875rem"
                />
              </div>
              <div class="flex justify-center">
                <app-esqueleto
                  variante="texto"
                  [ancho]="i === 1 ? '14rem' : '12rem'"
                  alto="1.5rem"
                />
              </div>
            </div>

            <!-- Barra -->
            <div class="mt-3 w-full lg:mt-0">
              <app-esqueleto
                variante="barra"
                ancho="100%"
                alto="2.25rem"
              />
            </div>
          </div>
        </article>
      </li>
    }
  </ul>
</div>
