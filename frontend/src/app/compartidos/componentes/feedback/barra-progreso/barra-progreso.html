<div
  role="progressbar"
  [class]="clasesContenedor()"
  [attr.aria-label]="etiqueta()"
  aria-valuemin="0"
  [attr.aria-valuemax]="objetivo()"
  [attr.aria-valuenow]="actual()"
  [attr.aria-valuetext]="valorAccesible()"
>
  @if (tamano() === 'md') {
    <span
      class="absolute inset-y-0.5 left-0.5 rounded-pildora transition-[width] duration-500 ease-out motion-reduce:transition-none"
      [class]="clasesRelleno()"
      [style.width]="'calc(' + porcentaje() + '% - 4px)'"
      aria-hidden="true"
    ></span>

    <span
      class="relative z-10 flex h-full items-center justify-center px-3 font-titulo text-sm uppercase tracking-wide text-barra-texto sm:text-base md:text-lg"
    >
      {{ leyenda() }}
    </span>
  } @else {
    <span
      class="block h-full rounded-pildora transition-[width] duration-300 ease-out motion-reduce:transition-none"
      [class]="clasesRelleno()"
      [style.width.%]="porcentaje()"
      aria-hidden="true"
    ></span>
  }
</div>
