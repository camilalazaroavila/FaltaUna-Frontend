<button
  type="button"
  (click)="alternar()"
  class="inline-flex h-[2.75rem] cursor-pointer items-center gap-2 rounded-pildora border border-borde-coleccion bg-fondo-coleccion-superficie px-4 text-sm font-semibold text-texto-primario transition-colors hover:bg-white/6 focus-visible:border-borde-foco"
  [class.border-borde-coleccion-fuerte]="categoriaActiva() !== null"
  [class.text-marca-coleccion]="categoriaActiva() !== null"
  aria-haspopup="listbox"
  [attr.aria-expanded]="abierto()"
  aria-controls="lista-categorias-album"
  aria-label="Filtrar por categoría"
>
  @if (categoriaActivaObj(); as activa) {
    <span class="filtros__icono block size-5 shrink-0">
      <app-icono-categoria [categoria]="activa.categoria!" />
    </span>
    <span class="truncate">Categoría: {{ activa.nombre }}</span>
  } @else {
    <ng-icon name="phosphorStackFill" class="size-5 shrink-0" aria-hidden="true" />
    <span class="truncate">Categorías</span>
  }
  <ng-icon
    name="phosphorCaretDownFill"
    class="size-4 shrink-0 transition-transform"
    [class.rotate-180]="abierto()"
    aria-hidden="true"
  />
</button>

@if (abierto()) {
  <ul
    id="lista-categorias-album"
    role="listbox"
    aria-label="Categorías de marca"
    class="absolute left-0 top-full z-50 mt-1 max-h-72 w-56 overflow-y-auto rounded-md border border-borde-coleccion bg-fondo-coleccion-superficie p-1 shadow-alta"
  >
    <li role="option" [attr.aria-selected]="categoriaActiva() === null">
      <button
        type="button"
        class="flex w-full cursor-pointer items-center gap-2.5 rounded-sm px-3 py-2 text-left text-xs font-semibold text-texto-secundario hover:bg-white/10"
        [class.border-borde-coleccion-fuerte]="categoriaActiva() === null"
        [class.bg-marca-coleccion-fondo]="categoriaActiva() === null"
        [class.text-marca-coleccion]="categoriaActiva() === null"
        [attr.aria-pressed]="categoriaActiva() === null"
        (click)="alElegirTodas()"
      >
        <ng-icon name="phosphorStackFill" class="icono-todas" aria-hidden="true" />
        <span class="truncate">Todas</span>
      </button>
    </li>

    @for (categoria of conIcono(); track categoria.id) {
      <li role="option" [attr.aria-selected]="categoriaActiva() === categoria.id">
        <button
          type="button"
          class="flex w-full cursor-pointer items-center gap-2.5 rounded-sm px-3 py-2 text-left text-xs font-semibold text-texto-secundario hover:bg-white/10"
          [class.border-borde-coleccion-fuerte]="categoriaActiva() === categoria.id"
          [class.bg-marca-coleccion-fondo]="categoriaActiva() === categoria.id"
          [class.text-marca-coleccion]="categoriaActiva() === categoria.id"
          [attr.aria-pressed]="categoriaActiva() === categoria.id"
          [attr.aria-label]="'Filtrar álbumes por ' + etiquetaDe[categoria.categoria!]"
          (click)="alElegir(categoria.id)"
        >
          <span class="filtros__icono block size-5 shrink-0">
            <app-icono-categoria [categoria]="categoria.categoria!" />
          </span>
          <span class="truncate">{{ etiquetaDe[categoria.categoria!] }}</span>
        </button>
      </li>
    }
  </ul>
}
