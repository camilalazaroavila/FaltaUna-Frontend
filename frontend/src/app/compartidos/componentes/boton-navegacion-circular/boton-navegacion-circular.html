<button
  type="button"
  [class]="clases()"
  [disabled]="deshabilitado()"
  [attr.aria-disabled]="deshabilitado() ? 'true' : null"
  [attr.aria-label]="etiquetaAccesible()"
  [attr.title]="etiquetaAria()"
  [attr.aria-pressed]="activo() ? 'true' : null"
  (click)="accion.emit()"
>
  <ng-icon [name]="icono()" [size]="tamanio() === 'lg' ? '24' : '20'" aria-hidden="true" />

  @if (insignia() !== null) {
    <span
      class="absolute -top-1 -right-1 inline-flex items-center justify-center rounded-circulo bg-atencion px-1.5 font-interfaz text-[0.625rem] leading-[1.125rem] text-atencion-sobre"
      aria-hidden="true"
    >
      {{ insignia() }}
    </span>
  }
</button>
