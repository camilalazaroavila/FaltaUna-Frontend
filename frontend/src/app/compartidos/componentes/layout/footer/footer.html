<footer>
  <div class="contenedor-landing py-10 md:py-14 lg:py-16">
    <div
      class="grid gap-8 md:grid-cols-2 lg:grid-cols-[1.5fr_1fr_1fr] lg:gap-12"
    >
      <!-- Marca -->
      <div class="max-w-sm">
        <a routerLink="/" class="inline-block" aria-label="Falta Una, ir al inicio">
          <img [src]="urlLogo()" alt="Falta Una" class="h-12 w-auto md:h-14 lg:h-16" />
        </a>
        <p
          class="mt-4 font-interfaz text-sm leading-relaxed"
          [ngClass]="clasesTextoTenue()"
        >
          {{ descripcion }}
        </p>
      </div>

      <!-- Navegación -->
      <nav class="flex flex-col gap-3" aria-labelledby="footer-navegacion-titulo">
        <h2
          id="footer-navegacion-titulo"
          class="font-interfaz text-xs font-bold uppercase tracking-widest"
          [ngClass]="clasesTextoTenue()"
        >
          Navegación
        </h2>
        @for (enlace of navegacion(); track enlace.etiqueta) {
          <a
            [routerLink]="enlace.ruta"
            [queryParams]="enlace.queryParams"
            class="w-fit font-interfaz text-sm font-semibold transition-opacity hover:opacity-80 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco motion-reduce:transition-none"
          >
            {{ enlace.etiqueta }}
          </a>
        }
      </nav>

      <!-- Cuenta -->
      <nav class="flex flex-col gap-3" aria-labelledby="footer-cuenta-titulo">
        <h2
          id="footer-cuenta-titulo"
          class="font-interfaz text-xs font-bold uppercase tracking-widest"
          [ngClass]="clasesTextoTenue()"
        >
          Cuenta
        </h2>
        @for (enlace of cuenta(); track enlace.etiqueta) {
          <a
            [routerLink]="enlace.ruta"
            [queryParams]="enlace.queryParams"
            class="w-fit font-interfaz text-sm font-semibold transition-opacity hover:opacity-80 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco motion-reduce:transition-none"
          >
            {{ enlace.etiqueta }}
          </a>
        }
      </nav>
    </div>

    <!-- Franja inferior: copyright y descargo -->
    <div class="mt-10 border-t pt-6 md:mt-12" [ngClass]="claseBorde()">
      <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between md:gap-8">
        <p class="font-interfaz text-xs" [ngClass]="clasesTextoTenue()">
          © {{ anio }} Falta Una. Todos los derechos reservados.
        </p>
        <p
          class="max-w-2xl font-interfaz text-xs leading-relaxed"
          [ngClass]="clasesTextoTenue()"
        >
          {{ descargo }}
        </p>
      </div>
    </div>

    <!-- Redes sociales y enlaces legales/de ayuda: omitidos hasta contar con
         URLs y rutas reales (Open Decision). -->
  </div>
</footer>
