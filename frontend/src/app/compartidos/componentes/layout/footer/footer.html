<footer class="border-t border-borde-default bg-fondo-elevado text-texto-primario">
  <div
    class="contenedor-landing flex flex-col items-center gap-4 py-6 md:flex-row md:justify-between md:gap-6 lg:py-8"
  >
    <a routerLink="/" class="shrink-0" aria-label="Falta Una, ir al inicio">
      <img [src]="urlLogo()" alt="Falta Una" class="h-8 w-auto sm:h-9" />
    </a>

    <nav
      class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 sm:gap-x-6"
      aria-label="Enlaces del pie de página"
    >
      @for (enlace of enlaces(); track enlace.etiqueta) {
        <a
          [routerLink]="enlace.ruta"
          [queryParams]="enlace.queryParams"
          class="font-interfaz text-[11px] font-bold uppercase tracking-wide text-texto-secundario transition-colors hover:text-texto-primario focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco sm:text-xs"
        >
          {{ enlace.etiqueta }}
        </a>
      }
    </nav>

    <p class="font-interfaz text-[10px] text-texto-apagado sm:text-xs">
      © {{ anio }} Falta Una. Todos los derechos reservados.
    </p>
  </div>

  <!-- Redes sociales: bloque omitido hasta contar con URLs reales (Open Decision). -->
</footer>
