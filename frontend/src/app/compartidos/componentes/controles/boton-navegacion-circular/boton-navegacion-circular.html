<button
  type="button"
  [class]="clases()"
  [disabled]="deshabilitado()"
  [attr.aria-disabled]="deshabilitado() ? 'true' : null"
  [attr.aria-label]="etiquetaAccesible()"
  [attr.title]="etiquetaAria()"
  [attr.aria-pressed]="activo() ? 'true' : null"
  (click)="accion.emit()"
>
  @if (expandible()) {
    <div
      class="flex shrink-0 items-center justify-center"
      [class]="tamanio() === 'sm' ? 'size-9' : tamanio() === 'lg' ? 'size-[3.25rem]' : 'size-11'"
    >
      @if (urlIcono()) {
        <img
          [src]="urlIcono()"
          alt=""
          [class]="tamanio() === 'lg' ? 'size-6' : 'size-5'"
          class="shrink-0 object-contain"
          aria-hidden="true"
        />
      } @else if (icono()) {
        <ng-icon [name]="icono()!" [size]="tamanio() === 'lg' ? '24' : '20'" [class.text-black]="!activo() && fondoBlanco()" aria-hidden="true" />
      }
    </div>

    <!-- Etiqueta flotante: aparece a la derecha del círculo sin afectar el ancho de la barra -->
    <span
      class="pointer-events-none absolute left-full ml-3 whitespace-nowrap rounded-lg px-3 py-1.5 font-interfaz text-xs font-bold uppercase tracking-wider shadow-md opacity-0 scale-95 group-hover:opacity-100 group-hover:scale-100 transition-all duration-200 ease-out"
      [class]="activo() ? 'bg-marca-primaria text-marca-sobre-primaria' : 'bg-white text-black'"
    >
      {{ etiquetaAria() }}{{ deshabilitado() ? ' (Próximamente)' : '' }}
    </span>
  } @else {
    @if (urlIcono()) {
      <img
        [src]="urlIcono()"
        alt=""
        [class]="tamanio() === 'lg' ? 'size-6' : 'size-5'"
        class="shrink-0 object-contain"
        aria-hidden="true"
      />
    } @else if (icono()) {
      <ng-icon [name]="icono()!" [size]="tamanio() === 'lg' ? '24' : '20'" aria-hidden="true" />
    }
  }

  @if (insignia() !== null) {
    <span
      class="absolute -top-1.5 -right-1.5 inline-flex items-center justify-center rounded-full border border-white shadow-md select-none"
      [class.bg-amber-400]="insignia() === '!'"
      [class.text-[#072326]]="insignia() === '!'"
      [class.animate-pulse]="insignia() === '!'"
      [class.size-5]="insignia() === '!'"
      [class.font-titulo]="insignia() === '!'"
      [class.text-xs]="insignia() === '!'"
      [class.font-black]="insignia() === '!'"
      [class.bg-atencion]="insignia() !== '!'"
      [class.text-atencion-sobre]="insignia() !== '!'"
      [class.px-1.5]="insignia() !== '!'"
      [class.font-interfaz]="insignia() !== '!'"
      [class.text-[0.625rem]]="insignia() !== '!'"
      [class.leading-[1.125rem]]="insignia() !== '!'"
      aria-hidden="true"
    >
      {{ insignia() }}
    </span>
  }
</button>
