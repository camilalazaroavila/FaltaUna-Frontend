<button
  #boton
  type="button"
  class="boton-jugar relative inline-flex items-center justify-center border-0 bg-transparent p-0 select-none cursor-pointer outline-none focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-borde-foco rounded-2xl transition-transform duration-200 ease-out disabled:cursor-not-allowed disabled:opacity-60 disabled:pointer-events-none"
  [class.boton-jugar--deshabilitado]="deshabilitado()"
  [disabled]="deshabilitado()"
  [attr.aria-label]="ariaLabel()"
  (click)="alHacerClic()"
>
  @if (!jaimeImagenError()) {
    <!-- Globo de diálogo imperativo ("¡Jugá!") para guiar al usuario -->
    <span class="boton-jugar__globo" aria-hidden="true">
      <span class="boton-jugar__globo-texto">{{ textoGlobo() }}</span>
    </span>

    <div class="boton-jugar__caja relative aspect-[435/387] w-full h-full">
      <!-- Asset reposo: cartas coleccionables -->
      <img
        #imgReposo
        [src]="urlReposo"
        width="435"
        height="387"
        alt=""
        aria-hidden="true"
        loading="eager"
        decoding="async"
        (error)="alFallarCarga()"
        class="boton-jugar__img boton-jugar__img--reposo absolute inset-0 size-full object-contain pointer-events-none drop-shadow-xl"
      />
      <!-- Asset hover/foco/activo: ¿jugamos? -->
      <img
        #imgHover
        [src]="urlHover"
        width="435"
        height="387"
        alt=""
        aria-hidden="true"
        loading="eager"
        decoding="async"
        (error)="alFallarCarga()"
        class="boton-jugar__img boton-jugar__img--hover absolute inset-0 size-full object-contain pointer-events-none drop-shadow-xl"
      />
    </div>
  } @else {
    <!-- Fallback legible si falla la imagen -->
    <div class="boton-jugar__respaldo inline-flex flex-col items-center justify-center gap-1.5 rounded-lg bg-marca-primaria px-6 py-4 font-titulo uppercase leading-none text-marca-sobre-primaria shadow-alta">
      <ng-icon name="phosphorPlayFill" size="24" aria-hidden="true" />
      <span class="text-base tracking-[0.06em]">{{ texto() }}</span>
      @if (haySubtexto()) {
        <span class="font-cuerpo text-[10px] font-normal normal-case tracking-normal opacity-85">
          {{ subtexto() }}
        </span>
      }
    </div>
  }
</button>
