<section
  id="planes"
  class="bg-[#675679] py-10 sm:py-14 md:py-18 lg:py-20 text-white"
  aria-label="Planes para tu negocio"
>
  <div class="contenedor-landing">
    <!-- Grilla de las 3 tarjetas de planes verticales -->
    <div
      class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8 max-w-md md:max-w-5xl xl:max-w-6xl mx-auto items-stretch"
    >
      @for (plan of planes(); track plan.id) {
        <app-plan-card class="block w-full h-full" [plan]="plan" />
      }
    </div>

    <!-- Botón Crear mi primer álbum -->
    <div class="mt-12 sm:mt-16 md:mt-20 flex justify-center text-center">
      <a
        routerLink="/registro"
        [queryParams]="{ modo: 'empresa' }"
        class="landing-btn-pildora landing-btn-pildora--teal"
      >
        Crear mi primer álbum &rarr;
      </a>
    </div>
  </div>
</section>
