<section id="planes" class="bg-landing-claro-fondo py-5 text-landing-claro-texto md:py-10 lg:py-16"
  aria-labelledby="planes-titulo">
  <div class="contenedor-landing">
    <h2 id="planes-titulo" class="font-titulo text-4xl leading-[0.9] md:text-5xl lg:text-landing-titulo">
      Planes para tu marca
    </h2>

    <div class="mt-8 flex flex-col gap-10 md:mt-12 md:gap-14 lg:mt-16 lg:gap-20">
      @for (plan of planes(); track plan.id) {
      <app-plan-card class="block w-full" [plan]="plan" />
      }
    </div>

    <div class="!mt-16 flex justify-center">
      <a app-boton routerLink="/empresa" tamanio="sm"
        class="!bg-[var(--color-azul-empresa)] !text-white hover:!bg-[color-mix(in_srgb,var(--color-azul-empresa)_86%,#ffffff)] habilitado:hover:!shadow-[var(--sombra-media),0_0_16px_color-mix(in_srgb,var(--color-azul-empresa)_45%,transparent)] habilitado:active:!bg-[color-mix(in_srgb,var(--color-azul-empresa)_80%,#000000)] focus-visible:!outline-[var(--color-azul-empresa)] lg:h-landing-cta lg:text-landing-ui">
        Crear mi primer álbum
      </a>
    </div>
  </div>
</section>
