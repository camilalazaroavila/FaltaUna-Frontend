<div
  class="faq-empresa"
  [class.faq-empresa--abierto]="abierto()">
  <button
    type="button"
    class="faq-empresa__cabecera"
    [id]="idCabecera"
    [attr.aria-expanded]="abierto()"
    [attr.aria-controls]="idPanel"
    (click)="alternar.emit()">
    <span class="faq-empresa__pregunta">{{ pregunta() }}</span>
    <span class="faq-empresa__flecha" aria-hidden="true">
      <svg
        class="size-4"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path d="M12 15.5l-6-6h12l-6 6z" />
      </svg>
    </span>
  </button>

  <div
    class="faq-empresa__panel"
    role="region"
    [id]="idPanel"
    [attr.aria-labelledby]="idCabecera"
    [attr.inert]="abierto() ? null : ''">
    <div class="faq-empresa__contenido">
      <p class="faq-empresa__respuesta">{{ respuesta() }}</p>
    </div>
  </div>
</div>
