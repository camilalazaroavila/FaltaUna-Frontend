<span class="cupon muesca-cupon inline-flex items-center rounded-md bg-cupon-fondo" [class]="clasesCuerpo()">
  <span #numero class="cupon-numero block text-titulo leading-titulo tabular-nums">{{ valor() }}</span>

  @if (esCompacta()) {
    <ng-icon name="phosphorTicketFill" size="18" aria-hidden="true" />
  } @else {
    <span class="cupon-leyenda font-interfaz text-menor uppercase tracking-etiqueta">{{ leyenda() }}</span>
  }
</span>
