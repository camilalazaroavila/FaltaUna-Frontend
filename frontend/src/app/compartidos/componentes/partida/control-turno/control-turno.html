<div class="flex flex-col items-stretch gap-2">
  @if (!resolviendo()) {
    <div class="flex flex-col gap-1">
      <span
        class="control-tiempo"
        [class]="clasesTiempo()"
        role="timer"
        [attr.aria-label]="etiquetaTiempo()"
      >
        @if (enAdvertencia()) {
          <ng-icon name="phosphorWarningFill" size="16" aria-hidden="true" />
        } @else {
          <ng-icon name="phosphorHourglassMediumFill" size="16" aria-hidden="true" />
        }
        {{ segundosRestantes() }}s
      </span>

      <span class="block h-1.5 w-full overflow-hidden rounded-pildora bg-hundido" aria-hidden="true">
        <span
          class="block h-full rounded-pildora transition-[width] duration-1000 ease-linear motion-reduce:transition-none"
          [class]="clasesBarra()"
          [style.width.%]="proporcion() * 100"
        ></span>
      </span>
    </div>
  }

  <button
    type="button"
    app-boton
    variante="primario"
    tamanio="lg"
    class="control-boton"
    [attr.aria-label]="textoBoton()"
    [disabled]="!activo()"
    [cargando]="!activo()"
    (click)="pulsarFinalizar()"
  >
    <span class="control-texto control-texto--largo">{{ textoBoton() }}</span>
    <span class="control-texto control-texto--corto">{{ textoBotonCorto() }}</span>
  </button>

  @if (!resolviendo()) {
    <div class="flex items-center justify-between gap-3 pt-1">
      <button
        type="button"
        class="font-interfaz text-xs font-semibold text-texto-secundario hover:text-error underline underline-offset-2 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco cursor-pointer"
        (click)="pedirConfirmacionAbandonar()"
      >
        Abandonar
      </button>
      <button
        type="button"
        class="font-interfaz text-xs font-semibold text-texto-secundario hover:text-error underline underline-offset-2 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco cursor-pointer"
        (click)="pedirConfirmacionRendirse()"
      >
        Rendirme
      </button>
    </div>
  }
</div>
