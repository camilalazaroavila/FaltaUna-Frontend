<div
  class="chip w-max flex items-center gap-2"
  [class.chip--rival]="esRival()"
  [class.flex-row-reverse]="esRival()"
  [attr.aria-label]="etiqueta()"
  role="group"
>
  <span class="relative shrink-0 -rotate-12" [class]="clasesAvatar()">
    <span
      class="absolute inset-[0.4rem] flex items-center justify-center overflow-hidden rounded-md bg-marca-acento font-titulo text-marca-sobre-acento"
      [class]="clasesInicial()"
      aria-hidden="true"
    >
      @if (avatarUrl() && !falloImagen()) {
        <img
          class="h-full w-full object-cover object-top"
          [src]="avatarUrl()"
          alt=""
          (error)="falloImagen.set(true)"
        />
      } @else {
        {{ inicial() }}
      }
    </span>
    <span class="marco-imagen absolute inset-0 bg-avatar-marco" aria-hidden="true"></span>
  </span>

<span class="whitespace-nowrap font-titulo text-etiqueta tracking-etiqueta uppercase">
  {{ nombre() }}
</span>
</div>
