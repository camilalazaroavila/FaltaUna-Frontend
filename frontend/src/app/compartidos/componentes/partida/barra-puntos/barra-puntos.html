<div
  class="barra-contenedor"
  [class.barra-contenedor--horizontal]="orientacion() === 'horizontal'"
  [class.barra-contenedor--vertical]="orientacion() === 'vertical'"
>

  <div
    class="barra-cuerpo relative flex items-center overflow-hidden rounded-pildora border-2 border-barra-puntos-borde bg-barra-puntos-fondo shadow-[0_3px_0_var(--barra-puntos-sombra)]"
    [class.cargando]="enCarga()"
    [class.cargando-propio]="enCarga() && !esRival()"
    [class.cargando-rival]="enCarga() && esRival()"
    role="progressbar"
    [attr.aria-label]="etiqueta()"
    aria-valuemin="0"
    [attr.aria-valuemax]="maximo()"
    [attr.aria-valuenow]="puntos()"
    [attr.aria-valuetext]="puntos() + ' de ' + maximo() + ' puntos'"
  >
    <span
      [class]="clasesRelleno()"
      [style.width]="orientacion() === 'horizontal' ? 'calc(' + porcentaje() + '% - 4px)' : null"
      [style.height]="orientacion() === 'vertical' ? 'calc(' + porcentaje() + '% - 4px)' : null"
      aria-hidden="true"
    ></span>

    @if (enCarga()) {
      <span class="barra-haz-luz" aria-hidden="true"></span>
    }

    @if (orientacion() === 'horizontal') {
      <div class="relative z-10 flex w-full items-center justify-between px-2.5 font-titulo text-menor tabular-nums text-texto-primario select-none leading-none">
        <span class="barra-numero font-bold texto-contorno" [class.cargando]="enCarga()" aria-hidden="true">
          {{ puntos() }}
        </span>
        <span class="barra-meta text-etiqueta font-bold opacity-85 texto-contorno" aria-hidden="true">
          / {{ maximo() }}
        </span>
      </div>
    } @else {
      <span class="barra-numero" [class]="clasesNumero()" [class.cargando]="enCarga()" aria-hidden="true">
        {{ puntos() }}
      </span>
    }
  </div>

  <span #deltaFlotante [class]="clasesDelta()" aria-hidden="true">
    {{ textoDelta() }}
  </span>
</div>
