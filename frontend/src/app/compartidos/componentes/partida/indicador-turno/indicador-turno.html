<div class="flex flex-col items-start gap-2">
  <span
    class="rounded-pildora border-2 border-zona-marco bg-marca-primaria px-4 py-1 font-titulo text-cuerpo leading-titulo text-marca-sobre-primaria uppercase shadow-cartoon"
  >
    {{ resolviendo() ? 'Realizando turno' : 'Turno' }} {{ turno() }}/{{ totalTurnos() }}
  </span>

  <div class="flex flex-col gap-1">
    <span [class]="clasesTiempo()" role="timer" [attr.aria-label]="etiqueta()">
      @if (enAdvertencia()) {
        <ng-icon name="phosphorWarningFill" size="16" aria-hidden="true" />
      } @else {
        <ng-icon name="phosphorHourglassMediumFill" size="16" aria-hidden="true" />
      }
      {{ segundosRestantes() }}s
    </span>

    <span
      class="block h-1.5 w-full overflow-hidden rounded-pildora bg-hundido"
      aria-hidden="true"
    >
      <span
        class="block h-full rounded-pildora transition-[width] duration-1000 ease-linear motion-reduce:transition-none"
        [class]="clasesBarra()"
        [style.width.%]="proporcion() * 100"
      ></span>
    </span>
  </div>

  @if (confirmando()) {
    <div
      role="alertdialog"
      aria-modal="false"
      [attr.aria-labelledby]="idConfirmacion"
      class="flex flex-col gap-2 rounded-md border-2 border-zona-marco bg-superficie p-3 text-texto-primario shadow-cartoon"
      (keydown.escape)="cancelar()"
    >
      <p [id]="idConfirmacion" class="font-titulo text-cuerpo uppercase">¿Rendirse? Cuenta como derrota.</p>
      <div class="flex gap-2">
        <button #botonCancelar type="button" app-boton variante="terciario" tamanio="sm" (click)="cancelar()">
          Cancelar
        </button>
        <button type="button" app-boton variante="peligro" tamanio="sm" (click)="confirmar()">
          Sí, rendirme
        </button>
      </div>
    </div>
  } @else {
    <button
      type="button"
      class="area-tactil font-interfaz text-menor font-bold text-texto-secundario hover:text-error underline underline-offset-2 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco cursor-pointer"
      (click)="pedirConfirmacion()"
    >
      Rendirme
    </button>
  }
</div>
