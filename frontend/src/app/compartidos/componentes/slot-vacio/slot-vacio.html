@if (marcable()) {
  <button
    type="button"
    class="slot-vacio slot-vacio--interactiva"
    [class.slot-vacio--marcada]="marcada()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-pressed]="marcada()"
    (click)="alternar.emit()"
  >
    <ng-icon
      [name]="marcada() ? 'phosphorHeartFill' : 'phosphorPlusFill'"
      class="slot-vacio__icono"
      aria-hidden="true"
    />
  </button>
} @else {
  <!--necesito que el logo quede centrado-->
  <div class="slot-vacio" role="img" [attr.aria-label]="ariaLabel()">
    <ng-icon name="phosphorPlusFill" class="slot-vacio__icono flex-center" aria-hidden="true" />
  </div>
}
