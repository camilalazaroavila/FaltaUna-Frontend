<!--
  El `<svg>` vive en un `<ng-template>` y se proyecta con `ngTemplateOutlet`
  dentro del `<button>` o del `<div>` segun `clickeable`. Asi el markup del
  sobre es una sola fuente de verdad.

  Efecto holografico (solo clickeable): el puntero mueve variables CSS en el
  `<button>`; la escena se inclina y dos capas HTML (brillo y reflejo) se
  recortan con la silueta del sobre. Todo el movimiento es transform/opacity.
-->
@if (clickeable()) {
  <button
    type="button"
    [class]="clases()"
    [attr.aria-label]="etiqueta()"
    [attr.title]="etiqueta()"
    (click)="accion.emit()"
    (pointermove)="moverPuntero($event)"
    (pointerleave)="soltarPuntero($event)"
  >
    <ng-container [ngTemplateOutlet]="sobre"></ng-container>
  </button>
} @else {
  <div role="img" [class]="clases()" [attr.aria-label]="etiqueta()">
    <ng-container [ngTemplateOutlet]="sobre"></ng-container>
  </div>
}

<ng-template #sobre>
  <span class="sobre__escena" [class.sobre__escena--holo]="clickeable()">
    <svg
      viewBox="0 0 208.67 340.93"
      xmlns="http://www.w3.org/2000/svg"
      class="block h-auto w-full"
      aria-hidden="true"
      focusable="false"
    >
      <!-- Silueta del sobre (los 4 paths del cuerpo) normalizada a 0..1 para
           recortar las capas HTML del efecto. Id unico por instancia. -->
      <defs>
        <clipPath [attr.id]="idSilueta" clipPathUnits="objectBoundingBox">
          <g transform="scale(0.00479226 0.00293315)">
            @for (d of cuerpo; track $index) {
              <path [attr.d]="d" />
            }
          </g>
        </clipPath>
      </defs>

      <!-- Cuatro caras del envoltorio (Paquete1 / Paquete2): misma geometria,
           solo cambian los colores por token. -->
      <g class="sobre__cuerpo">
        @for (d of cuerpo; track $index) {
          <path [attr.d]="d" />
        }
      </g>

      @if (esCategoria() && iconoCategoria(); as icono) {
        <!-- Sobre de categoria: placa blanca + icono con aire + nombre -->
        <defs>
          <clipPath [attr.id]="idPlaca">
            <rect x="26" y="82" width="157" height="150" rx="16" />
          </clipPath>
        </defs>

        <rect class="sobre__placa" x="26" y="82" width="157" height="150" rx="16" />

        <g [attr.clip-path]="'url(#' + idPlaca + ')'">
          <svg
            [attr.viewBox]="'0 0 ' + icono.ancho + ' ' + icono.alto"
            x="46"
            y="102"
            width="117"
            height="110"
            preserveAspectRatio="xMidYMid meet"
            aria-hidden="true"
            focusable="false"
          >
            @for (d of icono.trazos; track $index) {
              <path [attr.d]="d" class="sobre__icono" />
            }
          </svg>
        </g>

        @if (nombreVisible(); as texto) {
          <text x="104.3" y="262" text-anchor="middle" class="sobre__nombre" font-size="16" letter-spacing="0.04em">
            {{ texto }}
          </text>
        }
      } @else if (conLogo()) {
        @let caja = cajaLogo();

        <!-- Sobre de marca: sin placa blanca. La imagen es lo que se ve, con
             esquinas redondeadas y las medidas exactas de su proporcion. -->
        <defs>
          <clipPath [attr.id]="idPlaca">
            <rect [attr.x]="caja.x" [attr.y]="caja.y" [attr.width]="caja.ancho" [attr.height]="caja.alto" rx="14" />
          </clipPath>
        </defs>

        @if (cargando()) {
          <rect class="sobre__placa sobre__placa--cargando" x="26" y="82" width="157" height="150" rx="16" />
        }

        <image
          #logoImagen
          class="sobre__logo"
          [class.sobre__logo--oculto]="cargando()"
          [attr.href]="logoUrl()"
          [attr.clip-path]="'url(#' + idPlaca + ')'"
          [attr.x]="caja.x"
          [attr.y]="caja.y"
          [attr.width]="caja.ancho"
          [attr.height]="caja.alto"
          preserveAspectRatio="xMidYMid meet"
          (load)="imagenCargada()"
          (error)="imagenFallida()"
        />

        @if (nombreVisible(); as texto) {
          <text x="104.3" y="262" text-anchor="middle" class="sobre__nombre" font-size="16" letter-spacing="0.04em">
            {{ texto }}
          </text>
        }
      } @else {
        <!-- Sin marca, o con una URL que no carga: el envoltorio generico. -->
        <g class="sobre__letras">
        <path d="M19.91,45.19c10.36,0,20.58,0,30.8,0,.09,7.4.24,13.75.33,21.15a101,101,0,0,1-16.47.77c.52,6.68.78,10,1.29,16.77a77.91,77.91,0,0,0,12.34,3q.28,13.43.58,26.86a42.14,42.14,0,0,1-10.14-1.41q-.35,15.56-.71,31.1a94,94,0,0,1-18-15.05C19.68,99.82,20.15,73.69,19.91,45.19Z" />
        <path d="M73.06,147.92c-.72-5.2-1.08-7.88-1.81-13.37a53.29,53.29,0,0,1-10.39,1.13c-.37,5.49-.46,9-.83,14.41a35.81,35.81,0,0,1-12.33-2c3.58-33.72,6.86-69.2,9.94-103H80c3,31.36,6.69,62.75,10.65,94A90.79,90.79,0,0,1,73.06,147.92ZM69.64,74.75q-2,17.7-4.07,35.4c3.28-.14,4.92-.29,8.2-.7Q71.63,92.1,69.64,74.75Z" />
        <path d="M91.8,45.16c6.76,0,6,0,12.73,0,0,19.59,0,44.27,0,63.86,4.39-2.75,13.93-10.48,18.32-13q.29,10.45.58,20.91c-10.68,6.47-20.24,14.39-30.82,21C92.57,107.35,91.84,75.72,91.8,45.16Z" />
        <path d="M126.72,65.1c-3.77.55-5.65.83-9.42,1.36.21-7.37.4-13.93.62-21.3,12.3.05,23.45,0,35.73,0,0,6,0,8.78-.06,15.19-3.83.57-5.74.9-9.56,1.7q-.18,23.16-.32,46.31c-5.54.7-11.39,3.41-16.52,6.21C127.07,98.23,126.86,81.45,126.72,65.1Z" />
        <path d="M174.06,113.77c-.73-4.69-1.09-7-1.81-11.51a39.35,39.35,0,0,0-10.4-3.49c-.36,3.73-.54,5.61-.9,9.44a37.13,37.13,0,0,0-12.34-1c3-20.81,6.35-41.35,10-62.06,7.6-.06,15.07,0,22.53,0,4,27.91,7.23,55.13,10.29,83.16C186.49,122.7,180.71,117.25,174.06,113.77Zm-3.43-52.08c-1.35,7.06-2.72,14.11-4.06,21.17a51.65,51.65,0,0,1,8.2,2.75C173.44,77.63,172.09,69.65,170.63,61.69Z" />
        <path d="M43.91,180.66c5.19,1.71,7.8,2.94,13,2.9.29,14.35.56,27.83.89,42.18,2.45.22,3.68.3,6.13.4-.33-14.56-.6-28-.88-42.61,5.75-.36,12.4-2.77,17.54-5.45.39,22.72.8,45.21,1.29,67.93-13.66,0-26.16.09-39.38,0C43,224.3,43.46,202.38,43.91,180.66Z" />
        <path d="M108.54,195.05c.28-12.08.84-23.59,1.12-35.68,5-3.26,9.86-7,15.09-9.93-.25,31.47-.48,65.11-.71,96.58H109.29c-3.78-12.63-7.86-25.27-12.56-37.59q.4,18.8.84,37.59c-5.32,0-7.65,0-12.95,0-.05-23.34-.27-46.3-.31-69.65,5.35-3.29,8.35-4.9,13.7-8.7C101.73,177.15,105.13,185.51,108.54,195.05Z" />
        <path d="M151.54,246c-.72-6.66-1.14-9.31-1.86-15.86-4.16-.06-6.24-.06-10.4,0-.36,6.13-.53,9.57-.89,15.86-5.17,0-7.38,0-12.45,0,3.21-33.36,6.47-68.69,10-102,7.15-2.77,14.83-2.92,22.53-2.6,3.63,34.73,7,69.9,10.38,104.65C163.05,246,157.57,246,151.54,246ZM148.06,168Q146,185.34,144,202.72c3.28-.07,4.92-.06,8.2.08Q150.18,185.37,148.06,168Z" />
        <path d="M175.56,148.26a136.65,136.65,0,0,1,15.87,13.53V263.2H19.91V161.79c4.84,4.49,6.12,5.65,10.87,9.93-3.3,82.82,0,1.19-3.3,84,78.19-.35,78.19.23,156.38,0C180.83,217.59,180.58,188.17,175.56,148.26Z" />
        </g>
      }
    </svg>

    @if (clickeable()) {
      <span class="sobre__brillo" aria-hidden="true" [style.clip-path]="'url(#' + idSilueta + ')'"></span>
      <span class="sobre__reflejo" aria-hidden="true" [style.clip-path]="'url(#' + idSilueta + ')'"></span>
    }
  </span>
</ng-template>
