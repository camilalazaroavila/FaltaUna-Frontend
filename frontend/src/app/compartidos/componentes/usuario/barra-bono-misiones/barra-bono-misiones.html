@if (bono(); as datos) {
  <div class="barra-bono__grid flex flex-col gap-3 sm:gap-4">
    <!-- Subtítulo y timer en mobile / standalone -->
    <div class="barra-bono__encabezado flex flex-wrap items-center justify-between gap-2">
      <div class="barra-bono__subtitulo">
        <p class="font-cuerpo text-menor font-medium text-texto-secundario">
          Bono diario · Completá las {{ datos.totalRequeridas }} misiones para ganar un sobre
        </p>
      </div>

      <div class="barra-bono__timer">
        <app-reinicio-misiones
          [proximoReinicioUtc]="proximoReinicioUtc()"
          [offsetRelojMs]="offsetRelojMs()"
          (reinicioAlcanzado)="reinicioAlcanzado.emit()"
        />
      </div>
    </div>

    <!-- Sobre protagonista centrado -->
    <div
      class="barra-bono__sobre flex shrink-0 flex-col items-center justify-center gap-1.5 self-center py-1 sm:py-2"
      [class.barra-bono__sobre--disponible]="disponible()"
      [class.barra-bono__sobre--apagado]="!disponible() && !reclamado()"
      [class.barra-bono__sobre--reclamado]="reclamado()"
      [class.animate-latido-reclamo]="disponible() && !reclamando()"
    >
      <div
        class="barra-bono__sobre-aura relative flex items-center justify-center"
        [style.--progreso-ratio]="progresoRatio()"
      >
        <app-sobre-marca
          tamanio="sm"
          [fluido]="true"
          [clickeable]="disponible() && !reclamando()"
          [categoria]="sobreCategoria()"
          [nombre]="sobreNombre()"
          [logoUrl]="sobreLogo()"
          (accion)="reclamarBono()"
        />
      </div>

      <span
        class="font-interfaz text-menor font-bold tracking-wide"
        [class.text-energia-texto]="disponible()"
        [class.text-exito-texto]="reclamado()"
        [class.text-texto-secundario]="!disponible() && !reclamado()"
      >
        {{ etiquetaSobre() }}
      </span>
    </div>

    <!-- Barra de progreso abajo a todo el ancho -->
    <div
      role="progressbar"
      aria-label="Progreso del bono diario"
      aria-valuemin="0"
      [attr.aria-valuemax]="datos.totalRequeridas"
      [attr.aria-valuenow]="datos.completadas"
      [attr.aria-valuetext]="valorAccesible()"
      class="barra-bono__barra relative flex h-10 w-full items-stretch gap-1 overflow-hidden rounded-pildora border-2 border-barra-borde bg-barra-fondo p-1 shadow-[0_3px_0_var(--barra-sombra)] sm:h-11"
    >
      @for (lleno of segmentos(); track $index) {
        <span
          class="h-full flex-1 transition-colors duration-300 first:rounded-l-pildora last:rounded-r-pildora motion-reduce:transition-none"
          [class.bg-barra-mision-relleno]="lleno"
          [class.bg-superficie-base/40]="!lleno"
          aria-hidden="true"
        ></span>
      }

      <span
        class="pointer-events-none absolute inset-0 z-10 flex items-center justify-center px-3 font-titulo text-sm tracking-wide text-barra-texto tabular-nums sm:text-base"
      >
        {{ progresoTexto() }}
      </span>
    </div>
  </div>
}
