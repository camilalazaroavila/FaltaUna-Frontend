<div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
  @for (carta of cartas(); track carta.id) {
    @if (modoFavoritas()) {
      <button
        type="button"
        class="relative cursor-pointer rounded-lg border-4 border-transparent transition-transform hover:-translate-y-0.5 focus-visible:border-borde-foco motion-reduce:transition-none"
        [class.border-marca-coleccion]="carta.esFavorita"
        [attr.aria-pressed]="carta.esFavorita"
        [attr.aria-label]="(carta.esFavorita ? 'Quitar de favoritas: ' : 'Marcar como favorita: ') + (carta.obtenida ? carta.nombre : 'carta no obtenida')"
        (click)="alternarFavorita.emit(carta)"
      >
        <app-carta [carta]="carta" />
        @if (carta.esFavorita) {
          <svg
            class="absolute top-1 right-1 size-6 text-marca-coleccion"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
          </svg>
        }
      </button>
    } @else {
      <app-carta [carta]="carta" />
    }
  }
</div>
