@if (carta().oculta) {
  <div class="carta__reverso" role="img" aria-label="Carta oculta">
    <div class="carta__reverso-diseno"></div>
  </div>
} @else {
  <div class="carta__marco">
    <img
      class="carta__fondo"
      [src]="urlFondo()"
      alt=""
      aria-hidden="true"
      draggable="false"
    />

    <div class="carta__atributo carta__atributo--izq">
      <img class="carta__cuadrado carta__cuadrado--izq" [src]="urlCuadrado" alt="" aria-hidden="true" draggable="false" />
      <span class="carta__numero carta__numero--izq">{{ carta().atributoIzquierdo }}</span>
    </div>

    <!-- Atributo derecho (esquina sup. der.) -->
    <div class="carta__atributo carta__atributo--der">
      <img class="carta__cuadrado carta__cuadrado--der" [src]="urlCuadrado" alt="" aria-hidden="true" draggable="false" />
      <span class="carta__numero carta__numero--der">{{ carta().atributoDerecho }}</span>
    </div>

    <div class="carta__categoria" style="padding: 2%;">
      <img class="carta__cuadrado carta__cuadrado--categoria" [src]="urlCuadrado" alt="" aria-hidden="true" draggable="false"/>
      <app-icono-categoria [categoria]="carta().categoria"></app-icono-categoria>
    </div>

    @if (tieneEfectosCategoria()) {
      <div class="carta__indicador-efectos">
        <app-indicador-categorias-habilidad
          [efectos]="efectosCategoria()"
          [maxVisibles]="2"
          orientacion="vertical"
          tamanio="sm"
        />
      </div>
    }

    <div class="carta__imagen-wrapper">
      @if (!imagenRota() && urlImagen()) {
        <img
          class="carta__imagen"
          [src]="urlImagen()"
          [alt]="altImagen()"
          loading="lazy"
          draggable="false"
          (error)="alFallarImagen()"
        />
      } @else {
        <div class="carta__imagen-fallback">
          <app-icono-categoria [categoria]="carta().categoria"></app-icono-categoria>
          <span class="carta__nombre-fallback">{{ nombreVisible() }}</span>
        </div>
      }
    </div>

    <div class="carta__nombre-wrapper">
      <span class="carta__nombre">{{ nombreVisible() }}</span>
    </div>

    <div class="carta__estrellas">
      @for (estrella of estrellas(); track $index) {
        <app-estrella-rareza class="carta__estrella-slot"></app-estrella-rareza>
      }
    </div>
  </div>
}
