<div
  class="carta-popup__fondo fixed inset-0 z-40 bg-landing-oscuro-fondo/70 backdrop-blur-xs"
  (click)="cerrar.emit()"
  aria-hidden="true"
></div>

<div
  #dialogo
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="idTitulo"
  tabindex="-1"
  class="carta-popup__dialogo fixed left-1/2 top-1/2 z-50 max-h-[92dvh] w-[min(92vw,26rem)] -translate-x-1/2 -translate-y-1/2 overflow-y-auto rounded-3xl bg-landing-oscuro-fondo p-6 text-center text-landing-oscuro-texto shadow-alta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco"
>
  <button
    type="button"
    class="carta-popup__cerrar absolute top-3 right-3 flex size-8 cursor-pointer items-center justify-center rounded-md bg-marca-primaria font-bold text-marca-sobre-primaria focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco"
    aria-label="Cerrar detalle de la carta"
    (click)="cerrar.emit()"
  >
    ✕
  </button>

  <div class="mx-auto w-40">
    <app-carta [carta]="carta()" />
  </div>

  <h2 [id]="idTitulo" class="mt-4 font-titulo text-2xl uppercase text-marca-acento">
    {{ nombreVisible() }}
  </h2>
  <p class="mt-2 font-interfaz text-xs font-bold tracking-[0.06em] text-texto-secundario uppercase">
    {{ etiquetaMeta() }}
  </p>

  @if (carta().obtenida) {
    <p class="mt-3 font-interfaz text-base font-bold">{{ oracion() }}</p>
  } @else {
    <p class="mt-3 font-interfaz text-sm text-texto-secundario">Todavía no tenés esta carta.</p>
  }

  @if (esProvisional()) {
    <div class="mt-5 border-t border-white/10 pt-4">
      <button
        type="button"
        app-boton
        variante="peligro"
        tamanio="md"
        class="w-full"
        (click)="retirar.emit(); cerrar.emit()"
      >
        Devolver a mi mano
      </button>
    </div>
  }
</div>
