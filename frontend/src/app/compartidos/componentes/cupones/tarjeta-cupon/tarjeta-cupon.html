<button
  type="button"
  (click)="alHacerClick($event)"
  [attr.aria-label]="'Ver cupón de ' + cupon().marca + ': ' + etiquetaDescuento() + (noDisponible() ? ' (' + cupon().estado + ')' : '')"
  class="cupon group block aspect-[4/3] w-full cursor-pointer p-2 transition hover:-translate-y-1 hover:scale-[1.02] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-borde-foco motion-reduce:transition-none"
  [class.cupon--atenuado]="noDisponible()"
>
  <span class="cupon__hoja" aria-hidden="true"></span>

  <span
    class="relative flex size-full flex-col overflow-hidden rounded-sm border-2 border-solid border-(--crema) bg-(--color-teal-profundo)"
  >
    <span
      class="cupon__logo-zone relative flex h-[58%] w-full shrink-0 items-center justify-center overflow-hidden bg-(--color-teal-hundido) px-3 py-2"
    >
      @if (logoUrl() && !logoError()) {
        <img
          [src]="logoUrl()"
          [alt]="'Logo de ' + cupon().marca"
          class="cupon__logo size-full object-contain"
          loading="lazy"
          (error)="alErrorImagen()"
        />
      } @else {
        <span
          class="cupon__iniciales flex size-full items-center justify-center font-titulo text-3xl uppercase leading-none text-(--crema) sm:text-4xl"
        >
          {{ iniciales() }}
        </span>
      }

      @if (noDisponible()) {
        <span
          class="badge-estado absolute right-1.5 top-1.5 rounded-pildora px-2 py-0.5 font-interfaz text-[10px] font-bold uppercase tracking-wide"
          [class]="claseBadgeEstado()"
        >
          {{ cupon().estado }}
        </span>
      }
    </span>

    <!-- Banda sólida: nombre de marca -->
    <span
      class="w-full shrink-0 truncate bg-(--crema) px-2 py-1 text-center font-titulo text-sm uppercase leading-tight tracking-wide text-(--color-teal-profundo)"
      [title]="cupon().marca"
    >
      {{ cupon().marca }}
    </span>

    <span class="flex flex-1 flex-col justify-between gap-1 px-2 py-1.5">
      <span
        class="cupon__descuento font-titulo text-xl uppercase leading-none text-marca-primaria sm:text-2xl"
      >
        {{ etiquetaDescuento() }}
      </span>

      <span class="flex items-center justify-between gap-2">
        <span class="truncate font-interfaz text-[10px] text-texto-secundario">
          @if (vencimientoCorto(); as fecha) {
            Válido hasta {{ fecha }}
          } @else {
            Sin vencimiento
          }
        </span>

        <span
          class="cupon__flecha flex size-5 shrink-0 items-center justify-center rounded-circulo bg-marca-primaria text-xs font-bold leading-none text-marca-sobre-primaria transition group-hover:translate-x-0.5 motion-reduce:transition-none"
          aria-hidden="true"
          >→</span
        >
      </span>
    </span>
  </span>
</button>
