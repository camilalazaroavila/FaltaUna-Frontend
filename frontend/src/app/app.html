<div class="registro">

  <h1>Crear usuario</h1>

  <form (ngSubmit)="registrarUsuario()">

    <div>
      <label>Nombre de usuario</label>
      <input
        type="text"
        name="nombreUsuario"
        [(ngModel)]="nuevoUsuario.nombreUsuario"
        required
      >
    </div>

    <div>
      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="nuevoUsuario.email"
        required
      >
    </div>

    <div>
      <label>Contraseña</label>
      <input
        type="password"
        name="passwordHash"
        [(ngModel)]="nuevoUsuario.passwordHash"
        required
      >
    </div>

    <button type="submit">
      Registrarme
    </button>

  </form>

</div>
