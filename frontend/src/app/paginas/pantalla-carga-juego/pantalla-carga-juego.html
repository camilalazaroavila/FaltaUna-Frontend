<main
  class="grid min-h-dvh grid-cols-1 grid-rows-[1fr_auto_1fr] overflow-hidden bg-combate-fondo-carga px-6 text-center text-combate-texto"
>
  <!-- Anuncio para lectores de pantalla (lo visible se anima y no es "live") -->
  <p class="sr-only" role="status">{{ anuncio() }}</p>

  <!-- TODO: explosión verde de fondo (pendiente) -->

  <!-- Arriba: "Cargando..." y, al encontrar partida, "Nombre VS Nombre" -->
  <div class="min-w-0 self-center">
    <h1
      class="flex items-center justify-center gap-[0.4em] font-titulo text-[clamp(2rem,min(8vw,13dvh),8rem)] leading-none uppercase"
    >
      @if (encontrado()) {
      <span data-anim="nombre-propio" class="max-w-[40%] min-w-0 truncate" [title]="nombrePropio()">
        {{ nombrePropio() }}
      </span>
      <span data-anim="versus">vs</span>
      <span data-anim="nombre-rival" class="max-w-[40%] min-w-0 truncate" [title]="nombreRival()">
        {{ nombreRival() }}
      </span>
      } @else {
      Cargando...
      }
    </h1>
  </div>

  <!-- Separador decorativo: queda fijo en el centro en los dos estados -->
  <div class="mx-auto flex w-4/5 items-center gap-3 md:w-2/3" aria-hidden="true">
    <span class="h-0.5 flex-1 bg-combate-texto"></span>
    <svg class="size-10 shrink-0 text-combate-texto md:size-12" viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M12 0C12.9 7.2 16.8 11.1 24 12C16.8 12.9 12.9 16.8 12 24C11.1 16.8 7.2 12.9 0 12C7.2 11.1 11.1 7.2 12 0Z"
      />
    </svg>
    <span class="h-0.5 flex-1 bg-combate-texto"></span>
  </div>

  <!-- Abajo: vacío mientras carga; "¡A luchar!" al encontrar partida -->
  <div class="min-w-0 self-center">
    @if (encontrado()) {
    <p
      data-anim="luchar"
      class="font-titulo text-[clamp(2rem,min(8vw,13dvh),8rem)] leading-none uppercase"
    >
      ¡A luchar!
    </p>
    }
  </div>
</main>
