<main
  class="grid min-h-dvh grid-cols-1 overflow-hidden bg-combate-fondo-carga text-combate-texto md:grid-cols-[60%_1fr]">
  <!-- Columna de contenido: arriba queda fijo el título y abajo aparece el aviso, así nada salta de lugar -->
  <section class="flex flex-col items-center gap-8 px-6 pt-16 text-center md:gap-10 md:pt-[12dvh]">
    <h1
      class="font-titulo text-3xl leading-tight whitespace-pre-line uppercase sm:text-4xl md:text-5xl lg:text-[max(3rem,4vw)]">
      {{ textos.buscando }}
    </h1>

    <!-- Separador decorativo: línea, estrella de cuatro puntas, línea -->
    <div class="flex w-4/5 items-center gap-3 md:w-2/3" aria-hidden="true">
      <span class="h-0.5 flex-1 bg-combate-texto"></span>
      <svg class="size-10 shrink-0 text-combate-texto md:size-12" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 0C12.9 7.2 16.8 11.1 24 12C16.8 12.9 12.9 16.8 12 24C11.1 16.8 7.2 12.9 0 12C7.2 11.1 11.1 7.2 12 0Z" />
      </svg>
      <span class="h-0.5 flex-1 bg-combate-texto"></span>
    </div>

    <!-- role="status": los lectores de pantalla anuncian el aviso cuando aparece -->
    <div role="status" class="flex flex-col items-center gap-6">
      @if (encontrado()) {
        <div
          class="flex flex-col items-center gap-6 transition-[opacity,translate] duration-500 starting:translate-y-3 starting:opacity-0 motion-reduce:transition-none">
          <span class="flex size-24 items-center justify-center rounded-circulo bg-marca-primaria lg:size-28">
            <svg class="size-12 text-white lg:size-14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z" />
            </svg>
          </span>
          <p
            class="font-titulo text-3xl leading-tight whitespace-pre-line uppercase sm:text-4xl md:text-5xl lg:text-[max(3rem,4vw)]">
            {{ textos.listo }}
          </p>
        </div>
      }
    </div>
  </section>
</main>
