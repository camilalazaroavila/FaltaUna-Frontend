<main class="partida-activa flex flex-1 min-h-0 flex-col p-1 sm:p-2 overflow-hidden text-texto-primario">
  <div class="area-tablero min-h-0 flex-1 h-full w-full">
    <app-tablero
      [tutorialActivo]="tutorial.activo()"
      [bloquearArrastre]="bloquearArrastre()"
      [bloquearTurno]="bloquearTurno()"
      [bloquearJugada]="bloquearJugada()"
      (cartaVista)="alVerCarta()"
      (cartaDetalleCerrado)="alCerrarCarta()"
      (cartaJugada)="alJugarCarta()"
      (turnoFinalizado)="alFinalizarTurno()"
      (abandonar)="volver()"
      (rendirse)="volver()"
    />
  </div>
</main>

<app-tutorial-overlay (salir)="volver()" (terminar)="volver()" (seguir)="irAPartidaBot()" />
