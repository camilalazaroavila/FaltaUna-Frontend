<main class="mx-auto w-full max-w-[1600px] 2xl:max-w-[1800px] px-6 sm:px-10 lg:px-14 pb-16 pt-6">
  <app-encabezado-paso
    titulo="Elegí tu plan"
    [paso]="1"
  />

  <section
    class="mt-12 grid gap-12 sm:grid-cols-2 lg:grid-cols-3 lg:gap-8 items-stretch"
    aria-label="Planes mensuales disponibles"
  >
    @for (plan of planes; track plan.id) {
      <app-tarjeta-plan
        [plan]="plan"
        (elegir)="elegirPlan($event)"
      />
    }
  </section>
</main>
