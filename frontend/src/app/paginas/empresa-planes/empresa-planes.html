<main class="mx-auto w-full max-w-6xl px-4 pb-16 pt-4 sm:px-8">
  <app-encabezado-paso
    titulo="Elegí tu plan"
    [paso]="1"
    rutaVolver="/empresa/landing"
  />

  <section
    class="mt-10 grid gap-12 sm:grid-cols-2 lg:grid-cols-3 lg:gap-8"
    aria-label="Planes mensuales disponibles"
  >
    @for (plan of planes; track plan.id) {
      <app-tarjeta-plan
        [plan]="plan"
        (elegir)="elegirPlan($event)"
      />
    }
  </section>
</main>
