<main class="mx-auto w-full max-w-[1920px] px-6 sm:px-10 lg:px-12 2xl:px-16 pb-3 sm:pb-6 2xl:pb-10 pt-1 sm:pt-2 2xl:pt-4 flex flex-col justify-between">
  <app-encabezado-paso
    titulo="Elegí tu plan"
    [paso]="1"
  />

  <section
    class="mt-2 sm:mt-4 2xl:mt-10 w-full max-w-5xl xl:max-w-4xl 2xl:max-w-7xl mx-auto grid gap-4 lg:gap-5 xl:gap-4 2xl:gap-14 sm:grid-cols-2 lg:grid-cols-3 items-stretch"
    aria-label="Planes mensuales disponibles"
  >
    @for (plan of planes; track plan.id) {
      <app-tarjeta-plan
        [plan]="plan"
        (elegir)="elegirPlan($event)"
      />
    }
  </section>
</main>
