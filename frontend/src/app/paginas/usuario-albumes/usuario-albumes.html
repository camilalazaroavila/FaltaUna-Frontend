<div class="relative flex min-h-dvh flex-col overflow-x-hidden bg-usuario-gradiente-amarillo-verde text-white">
  <app-header [logueado]="true" />

  <main class="w-full px-1 pt-2 pb-8 sm:px-6 lg:px-8">
    <div class="flex flex-wrap items-start justify-between gap-3 py-4">
      <div class="flex flex-col items-start gap-1">
        <a app-boton variante="fantasma" tamanio="sm" routerLink="/usuario">← Volver</a>
        <h1 class="font-titulo text-4xl text-texto-primario sm:text-5xl">Álbumes</h1>
      </div>

      <button
        app-boton
        type="button"
        [variante]="modoFavoritas() ? 'secundario' : 'primario'"
        [attr.aria-pressed]="modoFavoritas()"
        (click)="alternarModoFavoritas()"
      >
        {{ modoFavoritas() ? 'Listo' : 'Marcar cartas que quiero' }}
      </button>
    </div>

    <div class="flex flex-col gap-6 md:flex-row">
      <app-barra-categorias
        [categorias]="categorias"
        [seleccionada]="categoriaSeleccionada()"
        (seleccionar)="elegirCategoria($event)"
      />

      <section class="min-w-0 flex-1">
        @if (albumActual(); as album) {
          <div class="flex flex-col gap-6">
            <app-encabezado-album
              [album]="album"
              [obtenidas]="progreso().obtenidas"
              [total]="progreso().total"
            />
            <app-grilla-cartas-album
              [cartas]="cartas()"
              [modoFavoritas]="modoFavoritas()"
              (alternarFavorita)="alternarFavoritaDeCarta($event)"
            />
          </div>
        } @else {
          <p class="py-16 text-center text-texto-secundario">No hay álbumes en esta categoría.</p>
        }
      </section>
    </div>
  </main>
</div>
