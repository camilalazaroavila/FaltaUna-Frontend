<div class="space-y-8">
  <app-tarjeta-muestra
    titulo="app-boton-jugar"
    descripcion="El botón ilustrado de Jaime para acceder a jugar. Muestra a Jaime con las cartas coleccionables en reposo y cambia a ¿jugamos? en hover, foco por teclado o toque activo, con área táctil accesible y escalado fluido."
  >
    <div class="grid gap-8 rounded-lg bg-fondo-hundido p-8 sm:grid-cols-3 sm:items-center">
      <div class="flex flex-col items-center gap-3">
        <app-boton-jugar (accion)="registrar('accion emitida (por defecto)')" />
        <span class="font-interfaz text-xs text-texto-apagado">reposo / hover</span>
      </div>

      <div class="flex flex-col items-center gap-3">
        <app-boton-jugar
          ariaLabel="Entrar a jugar ahora"
          (accion)="registrar('accion emitida (con ariaLabel)')"
        />
        <span class="font-interfaz text-xs text-texto-apagado">con ariaLabel personalizado</span>
      </div>

      <div class="flex flex-col items-center gap-3">
        <app-boton-jugar [deshabilitado]="true" />
        <span class="font-interfaz text-xs text-texto-apagado">deshabilitado</span>
      </div>
    </div>

    <div slot="nota" class="mt-4 rounded-md border-l-2 border-marca-acento bg-marca-primaria/10 px-3 py-2">
      <p class="font-interfaz text-xs text-landing-oscuro-texto">
        Este componente utiliza los dos assets ilustrados de Jaime apilados en una relación de aspecto 1:1 con <code>object-fit: contain</code>.
        Soporta <code>:hover</code> con mouse, <code>:focus-visible</code> por teclado y <code>:active</code> en dispositivos táctiles sin quedar atascado.
      </p>
    </div>
  </app-tarjeta-muestra>

  <div class="border-t border-borde-default pt-4">
    <app-registro-eventos [registros]="registros()" />
  </div>
</div>
