<div class="space-y-8">
  <app-tarjeta-muestra
    titulo="app-navegacion-ola (Mobile y Desktop)"
    descripcion="Componente unificado de navegación con efecto ola: barra inferior mobile (5 columnas, botón central Jugar al 50%, ola continua y panel 'Más') y barra lateral vertical derecha en desktop (radios redondeados hacia contenido y ola interactiva con hover)."
  >
    <div class="mb-4 flex flex-wrap items-center gap-4">
      <span class="font-interfaz text-xs text-texto-apagado">
        Ruta simulada activa: <code class="text-texto-primario">{{ rutaActiva() }}</code>
      </span>
    </div>

    <div class="grid grid-cols-1 gap-8 lg:grid-cols-2">
      @for (modo of modos; track modo) {
        <div
          [attr.data-modo]="modo"
          class="flex flex-col gap-6 rounded-lg border border-borde-default bg-fondo-app p-4 text-texto-primario shadow-media"
        >
          <div class="flex items-center justify-between">
            <span class="font-titulo text-sm uppercase tracking-wider text-marca-primaria">
              data-modo=&quot;{{ modo }}&quot;
            </span>
            <span class="font-interfaz text-xs text-texto-secundario">Orientaciones Mobile & Desktop</span>
          </div>

          <!-- Muestra Mobile (Viewport 393 px) -->
          <div class="mx-auto w-full max-w-[24.5625rem] overflow-hidden rounded-lg border border-borde-default bg-fondo-hundido pt-6">
            <p class="mb-3 px-4 font-interfaz text-xs text-texto-secundario">
              1. Orientación Mobile (5 columnas, Jugar al 50%, ola continua)
            </p>
            <app-navegacion-ola
              [modoVistaPrevia]="true"
              [vistaForzada]="'mobile'"
              [rutaActivaManual]="rutaActiva()"
              (seleccionarDestino)="seleccionar($event, modo)"
            />
          </div>

          <!-- Muestra Desktop (Barra lateral derecha con hover) -->
          <div class="mx-auto w-full max-w-[24.5625rem] overflow-hidden rounded-lg border border-borde-default bg-fondo-hundido p-6">
            <p class="mb-3 font-interfaz text-xs text-texto-secundario">
              2. Orientación Desktop (Barra lateral vertical derecha con hover)
            </p>
            <div class="relative flex min-h-[30rem] w-full items-center justify-center rounded-lg border border-dashed border-borde-default p-4">
              <app-navegacion-ola
                [modoVistaPrevia]="true"
                [vistaForzada]="'desktop'"
                [rutaActivaManual]="rutaActiva()"
                (seleccionarDestino)="seleccionar($event, modo)"
              />
            </div>
          </div>
        </div>
      }
    </div>

    <app-registro-eventos slot="eventos" [registros]="registros()" />
  </app-tarjeta-muestra>
</div>
