<div
  class="relative flex min-h-dvh flex-col justify-between overflow-x-hidden bg-usuario-gradiente-amarillo-verde text-white"
>

  <header class="relative z-40 w-full px-3 py-3 sm:px-5 sm:py-5 2xl:px-10 2xl:py-8">
    <div
      class="mx-auto flex max-w-[120rem] items-center justify-between gap-2 rounded-md bg-landing-oscuro-fondo px-3 py-2 text-landing-oscuro-texto shadow-md sm:gap-4 sm:px-4 lg:gap-6 lg:rounded-2xl lg:px-8 lg:py-3 2xl:gap-10 2xl:px-12 2xl:py-4"
    >
      <a routerLink="/" class="flex shrink-0 items-center" aria-label="Ir al inicio de Falta Una">
        <img [src]="urlLogo" alt="Falta Una" class="h-8 w-auto object-contain sm:h-9 lg:h-14 xl:h-[75px] 2xl:h-24" />
      </a>

      <form
        role="search"
        class="relative min-w-0 flex-1 md:w-64 md:flex-none lg:w-[320px] 2xl:w-[460px]"
        (submit)="buscarCampania($event)"
      >
        <label for="buscador-campanias" class="sr-only">Buscá tu álbum preferido</label>
        <svg
          class="pointer-events-none absolute left-2.5 top-1/2 size-3.5 -translate-y-1/2 text-landing-claro-texto/60 2xl:left-4 2xl:size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5 21 21" />
        </svg>
        <input
          id="buscador-campanias"
          type="search"
          autocomplete="off"
          placeholder="Buscá tu campaña preferida..."
          [value]="terminoBusqueda()"
          (input)="terminoBusqueda.set($any($event.target).value)"
          class="h-9 w-full rounded-pildora border border-transparent bg-landing-claro-fondo py-1.5 pl-8 pr-3 font-interfaz text-[11px] text-landing-claro-texto outline-none placeholder:text-landing-claro-texto/55 focus-visible:border-landing-marca md:h-10 md:text-sm 2xl:h-14 2xl:pl-12 2xl:text-lg"
        />
      </form>

      <div class="relative shrink-0 md:ml-auto">
        <button
          type="button"
          (click)="toggleMenuUsuario()"
          class="flex size-9 cursor-pointer items-center justify-center rounded-circulo border border-black/10 bg-marca-acento text-marca-sobre-acento shadow-sm transition hover:brightness-105 sm:size-10 2xl:size-14"
          aria-label="Menú de perfil"
          [attr.aria-expanded]="menuUsuarioAbierto()"
        >
          <svg
            class="size-5 text-[#0d3b40] sm:size-6 2xl:size-8"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>

        @if (menuUsuarioAbierto()) {
          <div
            class="absolute right-0 top-full mt-2 w-56 2xl:w-72 rounded-xl border border-white/10 bg-[#072428] p-3 2xl:p-4 shadow-alta backdrop-blur-md z-50"
          >
            <div class="border-b border-white/10 pb-2 mb-2">
              <p class="font-interfaz text-xs 2xl:text-sm uppercase tracking-wide text-texto-apagado">Sesión activa</p>
              <p class="font-titulo text-sm 2xl:text-lg text-marca-acento truncate">
                {{ authService.usuarioActual()?.nombreUsuario || 'Usuario' }}
              </p>
            </div>
            <button
              type="button"
              (click)="cerrarSesion()"
              class="w-full rounded-lg bg-white/10 px-3 py-2 2xl:py-3 text-left font-interfaz text-xs 2xl:text-base font-bold text-white transition hover:bg-error/30 hover:text-white cursor-pointer"
            >
              Cerrar sesión
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <!-- MENÚ LATERAL -->
  <aside
    aria-label="Navegación principal"
    class="fixed left-2 sm:left-3 md:left-5 lg:left-7 xl:left-8 2xl:left-12 top-[calc(50%+24px)] -translate-y-1/2 z-30 max-h-[calc(100dvh-130px)]"
  >
    <nav
      class="flex flex-col items-center gap-2 rounded-2xl border border-white/10 bg-[#072428]/95 p-1.5 shadow-alta backdrop-blur-md sm:gap-2.5 sm:p-2 md:rounded-3xl md:p-2.5 lg:gap-3 lg:p-3 xl:gap-3.5 xl:p-3.5 overflow-visible origin-left transition-transform lg:scale-105 2xl:scale-125 min-[2200px]:scale-150"
    >
      @for (destino of destinos; track destino.id) {
        <app-boton-navegacion-circular
          [urlIcono]="destino.urlIcono"
          [etiquetaAria]="destino.nombre"
          [activo]="seccionActiva() === destino.id"
          [expandible]="true"
          [fondoBlanco]="true"
          tamanio="md"
          (accion)="seleccionarSeccion(destino.id)"
        />
      }
    </nav>
  </aside>

  <!-- ZONA CENTRAL -->
  <main class="relative z-10 mx-auto flex w-full max-w-[120rem] min-h-0 flex-1 flex-col items-center justify-center px-14 py-3 sm:px-16 sm:py-6 md:px-24 md:py-8 lg:px-32 xl:px-40 2xl:px-52 2xl:py-12 min-[2200px]:px-64 [--alto-abanico:min(clamp(8rem,36vh,40rem),42vw)]">
    <!-- Contador de sobres disponibles -->
    <div
      class="mb-2 sm:mb-4 md:mb-6 2xl:mb-10 flex select-none items-center gap-2 2xl:gap-4 font-titulo text-base sm:text-xl md:text-2xl lg:text-3xl 2xl:text-5xl tracking-wider text-marca-acento shrink-0"
    >
      <span class="inline-block size-2 rounded-circulo bg-marca-acento sm:size-2.5 md:size-3 2xl:size-5"></span>
      <span>{{ sobresDisponibles().actuales }}/{{ sobresDisponibles().maximo }} GRATIS</span>
    </div>

    <!-- Abanico de Sobres: el alto fluye con el viewport y el ancho sale de la proporción -->
    <div
      class="relative flex items-center justify-center shrink-0 my-auto h-[var(--alto-abanico)] aspect-[16/10] w-auto"
    >
      <!-- Halo de luz detrás del abanico 
      <div
        class="pointer-events-none absolute -inset-[18%] -z-0 rounded-full bg-radial from-white/30 via-white/10 to-transparent blur-2xl"
        aria-hidden="true"
      ></div> -->

      <!-- Sombra de apoyo -->
      <div
        class="pointer-events-none absolute bottom-[-2%] left-1/2 h-[7%] w-[62%] -translate-x-1/2 rounded-full bg-black/25 blur-xl"
        aria-hidden="true"
      ></div>

      <!-- Sobre Izquierdo: categoría Gastronomía -->
      <div
        class="absolute left-[24%] sm:left-[28%] top-1/2 -translate-x-1/2 -translate-y-1/2 h-[82%] aspect-[208.67/340.93] -rotate-[12deg] z-10 transition-transform duration-200 hover:scale-105 hover:z-30 drop-shadow-xl"
      >
        <app-sobre-marca
          class="w-full [&>*]:w-full!"
          categoria="gastronomia"
          tamanio="lg"
          clickeable
          (accion)="abrirSelectorSobres()"
        />
      </div>

      <!-- Sobre Derecho: marca Lego -->
      <div
        class="absolute left-[76%] sm:left-[72%] top-1/2 -translate-x-1/2 -translate-y-1/2 h-[82%] aspect-[208.67/340.93] rotate-[12deg] z-10 transition-transform duration-200 hover:scale-105 hover:z-30 drop-shadow-xl"
      >
        <app-sobre-marca
          class="w-full [&>*]:w-full!"
          variante="claro"
          logoUrl="imagenes/lego.png"
          nombre="Lego"
          tamanio="lg"
          clickeable
          (accion)="abrirSelectorSobres()"
        />
      </div>

      <!-- Sobre Central: general (Paquete1 sin logo) -->
      <div
        class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 h-[96%] aspect-[208.67/340.93] z-20 transition-transform duration-200 hover:scale-105 hover:z-30 drop-shadow-2xl"
      >
        <app-sobre-marca
          class="w-full [&>*]:w-full!"
          tamanio="lg"
          clickeable
          (accion)="abrirSelectorSobres()"
        />
      </div>
    </div>

    <!-- Botón Principal "VER SOBRES" -->
    <button
      id="btn-ver-sobres"
      type="button"
      (click)="abrirSelectorSobres()"
      class="mt-3 sm:mt-5 md:mt-8 2xl:mt-14 shrink-0 cursor-pointer rounded-pildora bg-marca-primaria px-6 py-2.5 sm:px-8 sm:py-3 font-interfaz text-xs sm:text-sm font-black uppercase tracking-wider text-marca-sobre-primaria shadow-alta shadow-marca-primaria/25 transition-all hover:bg-marca-primaria-hover hover:shadow-brillo-verde active:scale-[0.98] md:px-12 md:py-3.5 md:text-base 2xl:px-20 2xl:py-5 2xl:text-2xl"
    >
      VER SOBRES
    </button>
  </main>

  <!-- ICONO FLOTANTE DE JUGAR -->
  <aside
    class="fixed bottom-3 right-3 sm:bottom-4 sm:right-4 md:bottom-6 md:right-6 lg:bottom-8 lg:right-8 xl:bottom-10 xl:right-10 2xl:bottom-14 2xl:right-14 z-20 cursor-pointer transition-transform hover:scale-110 active:scale-95"
    (click)="abrirSelectorSobres()"
    title="Abrir sobres y jugar"
  >
    <img
      [src]="urlIconPelea"
      alt="Abrir sobre"
      class="pointer-events-none size-12 sm:size-16 md:size-20 lg:size-24 xl:size-32 2xl:size-40 select-none drop-shadow-xl"
    />
  </aside>

  <app-flujo-apertura-sobres
    [abierto]="selectorSobresAbierto()"
    [sobresCatalogo]="sobresCatalogo()"
    [sobresDiariosDisponibles]="sobresDisponibles().actuales"
    (cerrar)="cerrarSelectorSobres()"
    (aperturaRealizada)="alCompletarApertura($event)"
  />
</div>
