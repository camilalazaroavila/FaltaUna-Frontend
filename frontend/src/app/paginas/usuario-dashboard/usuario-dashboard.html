<div
  class="relative flex min-h-dvh flex-col justify-between overflow-x-hidden bg-usuario-gradiente-amarillo-verde text-white">

  <app-header [logueado]="true" />

  <!-- MENÚ LATERAL -->
  <aside aria-label="Navegación principal"
    class="pointer-events-none fixed inset-x-0 bottom-0 z-30 flex justify-center px-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] md:pointer-events-auto md:inset-x-auto md:bottom-auto md:justify-start md:p-0 md:left-5 lg:left-7 xl:left-8 2xl:left-12 md:top-[calc(50%+24px)] md:-translate-y-1/2 md:max-h-[calc(100dvh-130px)]">
    <nav
      class="pointer-events-auto flex flex-row md:flex-col items-center justify-center gap-1.5 rounded-2xl border border-white/10 bg-[#072428]/95 p-1.5 shadow-alta backdrop-blur-md sm:gap-2.5 sm:p-2 md:rounded-3xl md:p-2.5 lg:gap-3 lg:p-3 xl:gap-3.5 xl:p-3.5 overflow-visible origin-bottom md:origin-left transition-transform lg:scale-105 2xl:scale-125 min-[2200px]:scale-150">
      @for (destino of destinos; track destino.id) {
      <app-boton-navegacion-circular [urlIcono]="destino.urlIcono ?? null" [icono]="destino.icono ?? null"
        [etiquetaAria]="destino.nombre" [activo]="seccionActiva() === destino.id" [expandible]="true"
        [fondoBlanco]="true" tamanio="md" (accion)="seleccionarSeccion(destino.id)" />
      }
    </nav>
  </aside>

  <!-- ZONA CENTRAL -->
  <main
    class="relative z-10 mx-auto flex w-full max-w-[120rem] min-h-0 flex-1 flex-col items-center justify-center px-4 pt-3 pb-24 sm:px-6 sm:pt-4 md:px-24 md:py-8 lg:px-32 xl:px-40 2xl:px-52 2xl:py-12 min-[2200px]:px-64 [--alto-abanico:min(clamp(9.5rem,46vh,46rem),64vw)] md:[--alto-abanico:min(clamp(9.5rem,46vh,46rem),52vw)]">

    <!-- Contador de sobres disponibles -->
    <div
      class="mb-5 sm:mb-2 md:mb-3 2xl:mb-6 flex select-none items-center gap-1.5 2xl:gap-3 font-titulo text-sm sm:text-base md:text-lg lg:text-xl 2xl:text-3xl tracking-wider text-marca-acento/90 shrink-0">
      <span class="inline-block size-1.5 rounded-circulo bg-marca-acento sm:size-2 md:size-2.5 2xl:size-3.5"></span>
      <span>{{ sobresDisponibles().actuales }}/{{ sobresDisponibles().maximo }} GRATIS</span>
    </div>


    <!-- Abanico de Sobres: el alto fluye con el viewport y el ancho sale de la proporción -->
    <div
      class="abanico-sobres relative flex items-center justify-center shrink-0 md:my-auto h-[var(--alto-abanico)] aspect-[16/10] w-auto">

      <!-- Halo de luz detrás del abanico 
      <div
        class="pointer-events-none absolute -inset-[18%] -z-0 rounded-full bg-radial from-white/30 via-white/10 to-transparent blur-2xl"
        aria-hidden="true"
      ></div> -->

      <!-- Sombra de apoyo -->
      <div
        class="pointer-events-none absolute bottom-[-2%] left-1/2 h-[7%] w-[62%] -translate-x-1/2 rounded-full bg-black/25 blur-xl"
        aria-hidden="true"></div>

      <!-- Sobre de Gastronomía -->
      <div class="sobre-carrusel sobre-carrusel--gastronomia">
        <app-sobre-marca class="w-full [&>*]:w-full!" categoria="gastronomia" tamanio="lg" clickeable
          (accion)="abrirSelectorSobres()" />
      </div>

      <!-- Sobre de Lego -->
      <div class="sobre-carrusel sobre-carrusel--lego">
        <app-sobre-marca class="w-full [&>*]:w-full!" variante="claro" logoUrl="imagenes/lego.png" nombre="Lego"
          tamanio="lg" clickeable (accion)="abrirSelectorSobres()" />
      </div>

      <!-- Sobre genérico -->
      <div class="sobre-carrusel sobre-carrusel--general">
        <app-sobre-marca class="w-full [&>*]:w-full!" tamanio="lg" clickeable (accion)="abrirSelectorSobres()" />
      </div>
    </div>

    <!-- Botón Principal "VER SOBRES" -->
    <button id="btn-ver-sobres" type="button" (click)="abrirSelectorSobres()"
      class="mt-10 sm:mt-4 md:mt-8 2xl:mt-14 shrink-0 cursor-pointer rounded-pildora bg-marca-primaria px-6 py-2.5 sm:px-8 sm:py-3 font-interfaz text-xs sm:text-sm font-black uppercase tracking-wider text-marca-sobre-primaria shadow-alta shadow-marca-primaria/25 transition-all hover:bg-marca-primaria-hover hover:shadow-brillo-verde active:scale-[0.98] md:px-12 md:py-3.5 md:text-base 2xl:px-20 2xl:py-5 2xl:text-2xl">
      VER SOBRES
    </button>
  </main>

  <!-- ICONO FLOTANTE DE JUGAR -->

  @if (juegoHabilitado) {
  <aside
    class="fixed bottom-3 right-3 sm:bottom-4 sm:right-4 md:bottom-6 md:right-6 lg:bottom-8 lg:right-8 xl:bottom-10 xl:right-10 2xl:bottom-14 2xl:right-14 z-20 cursor-pointer transition-transform hover:scale-110 active:scale-95"
    (click)="abrirSelectorSobres()" title="Abrir sobres y jugar">
    <img [src]="urlIconPelea" alt="Abrir sobre"
      class="pointer-events-none size-12 sm:size-16 md:size-20 lg:size-24 xl:size-32 2xl:size-40 select-none drop-shadow-xl" />
  </aside>
  }

  <app-flujo-apertura-sobres [abierto]="selectorSobresAbierto()" [sobresCatalogo]="sobresCatalogo()"
    [sobresDiariosDisponibles]="sobresDisponibles().actuales" (cerrar)="cerrarSelectorSobres()"
    (aperturaRealizada)="alCompletarApertura($event)" />
</div>
