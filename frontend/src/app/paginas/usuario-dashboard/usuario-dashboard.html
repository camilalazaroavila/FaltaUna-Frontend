<div
  class="relative flex min-h-screen flex-col justify-between overflow-x-hidden bg-usuario-gradiente-amarillo-verde text-white"
>

  <header class="w-full">
    <div
      class="m-3 flex items-center justify-between gap-2 rounded-md bg-landing-oscuro-fondo px-3 py-2 text-landing-oscuro-texto shadow-md sm:m-5 sm:gap-4 sm:px-4 lg:gap-6 lg:rounded-2xl lg:px-8 lg:py-3"
    >
      <a routerLink="/" class="flex shrink-0 items-center" aria-label="Ir al inicio de Falta Una">
        <img [src]="urlLogo" alt="Falta Una" class="h-8 w-auto object-contain sm:h-9 lg:h-[75px]" />
      </a>

      <form
        role="search"
        class="relative min-w-0 flex-1 md:w-64 md:flex-none lg:w-[320px]"
        (submit)="buscarCampania($event)"
      >
        <label for="buscador-campanias" class="sr-only">Buscá tu campaña preferida</label>
        <svg
          class="pointer-events-none absolute left-2.5 top-1/2 size-3.5 -translate-y-1/2 text-landing-claro-texto/60"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5 21 21" />
        </svg>
        <input
          id="buscador-campanias"
          type="search"
          autocomplete="off"
          placeholder="Buscá tu campaña preferida..."
          [value]="terminoBusqueda()"
          (input)="terminoBusqueda.set($any($event.target).value)"
          class="h-9 w-full rounded-pildora border border-transparent bg-landing-claro-fondo py-1.5 pl-8 pr-3 font-interfaz text-[11px] text-landing-claro-texto outline-none placeholder:text-landing-claro-texto/55 focus-visible:border-landing-marca md:h-10 md:text-sm"
        />
      </form>

      <div class="relative shrink-0 md:ml-auto">
        <button
          type="button"
          (click)="toggleMenuUsuario()"
          class="flex size-9 cursor-pointer items-center justify-center rounded-circulo border border-black/10 bg-marca-acento text-marca-sobre-acento shadow-sm transition hover:brightness-105 sm:size-10"
          aria-label="Menú de perfil"
          [attr.aria-expanded]="menuUsuarioAbierto()"
        >
          <svg
            class="size-5 text-[#0d3b40] sm:size-6"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>

        @if (menuUsuarioAbierto()) {
          <div
            class="absolute right-0 top-full mt-2 w-56 rounded-xl border border-white/10 bg-[#072428] p-3 shadow-alta backdrop-blur-md z-50"
          >
            <div class="border-b border-white/10 pb-2 mb-2">
              <p class="font-interfaz text-xs uppercase tracking-wide text-texto-apagado">Sesión activa</p>
              <p class="font-titulo text-sm text-marca-acento truncate">
                {{ authService.usuarioActual()?.nombreUsuario || 'Usuario' }}
              </p>
            </div>
            <button
              type="button"
              (click)="cerrarSesion()"
              class="w-full rounded-lg bg-white/10 px-3 py-2 text-left font-interfaz text-xs font-bold text-white transition hover:bg-error/30 hover:text-white cursor-pointer"
            >
              Cerrar sesión
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <aside aria-label="Navegación principal" class="fixed left-3 top-1/2 -translate-y-1/2 z-30 md:left-6">
    <nav
      class="flex flex-col items-center gap-2.5 rounded-2xl border border-white/10 bg-[#072428]/95 p-2 shadow-alta backdrop-blur-md md:gap-3 md:rounded-3xl md:p-2.5 overflow-visible"
    >
      @for (destino of destinos; track destino.id) {
        <app-boton-navegacion-circular
          [urlIcono]="destino.urlIcono"
          [etiquetaAria]="destino.nombre"
          [activo]="seccionActiva() === destino.id"
          [expandible]="true"
          [fondoBlanco]="true"
          tamanio="md"
          (accion)="seleccionarSeccion(destino.id)"
        />
      }
    </nav>
  </aside>

  <main class="relative z-10 flex flex-1 flex-col items-center justify-center px-4 py-8 md:py-12">
    <div
      class="mb-6 flex select-none items-center gap-2 font-titulo text-xl tracking-wider text-marca-acento md:mb-8 md:text-2xl lg:text-3xl"
    >
      <span class="inline-block size-2.5 rounded-circulo bg-marca-acento md:size-3"></span>
      <span>{{ sobresDisponibles().actuales }}/{{ sobresDisponibles().maximo }} GRÁTIS</span>
    </div>

    <div
      class="relative aspect-[16/11] w-full max-w-[320px] flex items-center justify-center sm:max-w-md md:max-w-lg lg:max-w-xl"
    >

      <div
        class="absolute left-[16%] top-1/2 z-10 w-[36%] -translate-x-1/2 -translate-y-1/2 -rotate-[10deg] cursor-pointer transition-transform duration-200 hover:scale-105 hover:z-30 md:left-[20%] md:-rotate-[12deg]"
        (click)="abrirSelectorSobres()"
        title="Sobre misterioso"
      >
        <img
          [src]="urlSobreIzquierda"
          alt="Sobre misterioso"
          class="pointer-events-none h-auto w-full select-none drop-shadow-xl"
        />
      </div>

      <div
        class="absolute left-[84%] top-1/2 z-10 w-[36%] -translate-x-1/2 -translate-y-1/2 rotate-[10deg] cursor-pointer transition-transform duration-200 hover:scale-105 hover:z-30 md:left-[80%] md:rotate-[12deg]"
        (click)="abrirSelectorSobres()"
        title="Sobre temático de marcas"
      >
        <img
          [src]="urlSobreDerecha"
          alt="Sobre temático"
          class="pointer-events-none h-auto w-full select-none drop-shadow-xl"
        />
      </div>

      <div
        class="absolute left-1/2 top-1/2 z-20 w-[42%] -translate-x-1/2 -translate-y-1/2 cursor-pointer transition-transform duration-200 hover:scale-105 hover:z-30"
        (click)="abrirSelectorSobres()"
        title="Sobre diario principal"
      >
        <img
          [src]="urlSobreCentro"
          alt="Sobre principal"
          class="pointer-events-none h-auto w-full select-none drop-shadow-2xl"
        />
      </div>
    </div>

    <button
      id="btn-ver-sobres"
      type="button"
      (click)="abrirSelectorSobres()"
      class="mt-6 cursor-pointer rounded-pildora bg-marca-primaria px-8 py-3 font-interfaz text-sm font-black uppercase tracking-wider text-marca-sobre-primaria shadow-alta shadow-marca-primaria/25 transition-all hover:bg-marca-primaria-hover hover:shadow-brillo-verde active:scale-[0.98] md:mt-10 md:px-12 md:py-3.5 md:text-base"
    >
      VER SOBRES
    </button>
  </main>

  <aside
    class="fixed bottom-4 right-4 z-20 cursor-pointer transition-transform hover:scale-110 active:scale-95 md:bottom-8 md:right-8"
    (click)="abrirSelectorSobres()"
    title="Abrir sobres y jugar"
  >
    <img
      [src]="urlIconPelea"
      alt="Abrir sobre"
      class="pointer-events-none size-16 select-none drop-shadow-lg sm:size-20 md:size-24"
    />
  </aside>

  <app-flujo-apertura-sobres
    [abierto]="selectorSobresAbierto()"
    [sobresCatalogo]="sobresCatalogo()"
    [sobresDiariosDisponibles]="sobresDisponibles().actuales"
    (cerrar)="cerrarSelectorSobres()"
    (aperturaRealizada)="alCompletarApertura($event)"
  />
</div>
