<app-auth-layout variante="login">

  <div class="mb-4 [@media(min-height:1000px)]:mb-6">
    <p class="text-sm font-black uppercase tracking-widest text-marca-primaria">
      {{ encabezado().eyebrow }}
    </p>
    <h1 class="mt-3 text-3xl sm:text-4xl">
      {{ encabezado().titulo }}
    </h1>
    <p class="mt-2 text-texto-secundario">
      {{ encabezado().descripcion }}
    </p>
  </div>

  @if (recienRegistrado) {
    <div class="mb-5 rounded-xl border border-exito-borde bg-exito-fondo px-4 py-3 text-sm font-bold text-exito-texto">
      Cuenta creada con éxito. Ya podés iniciar sesión.
    </div>
  }

  @if (error) {
    <div class="mb-5 rounded-xl border border-error-borde bg-error-fondo px-4 py-3 text-sm font-bold text-error-texto">
      {{ error }}
    </div>
  }

  <form (ngSubmit)="iniciarSesion()" class="space-y-2.5 [@media(min-height:1000px)]:space-y-4">

    <!-- Usuario o email -->
    <div>
      <label for="identificador" class="mb-1.5 block text-sm font-bold text-texto-primario">
        Usuario o email
      </label>
      <input id="identificador" type="text" name="identificador" [(ngModel)]="credenciales.identificador" required
        placeholder="Ej: Gonza123 o tu@email.com"
        class="w-full rounded-xl border border-borde-fuerte bg-fondo-app px-4 py-3.5 text-lg text-texto-primario transition
               focus-visible:border-borde-foco [@media(min-height:1000px)]:py-4" />
    </div>

    <!-- Contraseña -->
    <div>
      <label for="password" class="mb-1.5 block text-sm font-bold text-texto-primario">
        Contraseña
      </label>
      <input id="password" type="password" name="password" [(ngModel)]="credenciales.password" required
        placeholder="Tu contraseña"
        class="w-full rounded-xl border border-borde-fuerte bg-fondo-app px-4 py-3.5 text-lg text-texto-primario transition
               focus-visible:border-borde-foco [@media(min-height:1000px)]:py-4" />
    </div>

    <!-- Botón -->
    <button type="submit" [disabled]="cargando"
      class="w-full cursor-pointer rounded-xl bg-btn-primario-bg py-3.5 text-lg font-black text-btn-primario-texto
             shadow-baja transition duration-200 [@media(min-height:1000px)]:py-4
             hover:-translate-y-0.5 hover:bg-btn-primario-hover hover:shadow-media
             active:translate-y-0
             disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0">
      {{ cargando ? 'INGRESANDO...' : 'INICIAR SESIÓN' }}
    </button>

  </form>

  <div class="mt-4 border-t border-borde-default pt-4 text-center [@media(min-height:1000px)]:mt-6 [@media(min-height:1000px)]:pt-5">
    <p class="text-sm text-texto-apagado">
      ¿Todavía no tenés cuenta?
      <a routerLink="/registro" queryParamsHandling="preserve" class="font-bold text-texto-link hover:text-texto-link-hover">
        Registrate
      </a>
    </p>
  </div>

</app-auth-layout>
