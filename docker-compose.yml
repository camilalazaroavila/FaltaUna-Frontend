services:
  db:
    image: mysql:8.4
    container_name: tpi2026-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_tpi2026
      MYSQL_DATABASE: tpi2026
      MYSQL_USER: tpi2026
      MYSQL_PASSWORD: tpi2026_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_tpi2026"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: